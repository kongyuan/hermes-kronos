name: Kronos A股每日预测

on:
  schedule:
    # 每天 8:00 北京时间 = 0:00 UTC
    - cron: "0 0 * * 1-5"
  workflow_dispatch:  # 允许手动触发

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write    # 允许 git push 写回仓库

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 缓存 pip + 模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kronos-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: kronos-${{ runner.os }}-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 克隆 Kronos 仓库
        run: |
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos

      - name: 运行预测
        run: python predict.py

      - name: 提交结果
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@hermes.local"
          git add latest.json kronos_*.json
          git diff --staged --quiet || (
            git commit -m "🤖 Kronos 预测 $(date +%Y-%m-%d)" &&
            git push
          )
